name: iPhone build

on:
  push:
    branches: [main]
    paths: ["index.html", "ios-app/**", ".github/workflows/iphone.yml"]
  workflow_dispatch:

concurrency:
  group: iphone-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
        working-directory: ios-app
    env:
      HAS_KEY: ${{ secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)" && xcodebuild -version
      - name: Copy the game into the app
        run: npm ci && node make-www.cjs && npx cap sync ios

      - name: Check that the app compiles (no Apple key yet)
        if: env.HAS_KEY != 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -20

      - name: Build, sign and upload to TestFlight
        if: env.HAS_KEY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Secrets pasted by hand can carry stray spaces, line breaks or Windows line endings: clean them up.
          trim() { printf '%s' "$1" | tr -d '[:space:]'; }
          TEAM_ID=$(trim "$TEAM_ID"); ASC_KEY_ID=$(trim "$ASC_KEY_ID"); ASC_ISSUER_ID=$(trim "$ASC_ISSUER_ID")
          KEY="$RUNNER_TEMP/AuthKey.p8"
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -e 's/-----[A-Z ]*-----//g' | tr -d '[:space:]')
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          echo "Team ID: ${#TEAM_ID} characters (should be 10). Key ID: ${#ASC_KEY_ID} (should be 10). Issuer ID: ${#ASC_ISSUER_ID} (should be 36). Key body: ${#BODY} characters (about 184)."
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid App Store Connect key. Paste the whole text of the AuthKey .p8 file, BEGIN and END lines included."
            exit 1
          fi
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          VER=$(grep -o 'const GAME_VER = [0-9]*' ../index.html | grep -o '[0-9]*$')
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="1.0.$VER" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive | tail -30
          # The archive is built unsigned; the export step signs it for the App Store with Apple's cloud signing.
          # (Signing during archive would need a development profile, which needs a registered iPhone.)
          sed "s/TEAM_ID/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/out" \
            "${AUTH[@]}" | tail -30
          rm -f "$KEY"
