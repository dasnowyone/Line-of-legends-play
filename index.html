<style>
/* Full-screen sketchbook world: canvas fills the screen, paper-card UI floats over it. Single theme by choice (it is drawn on paper). */
:root {
  --paper: #f6f3ea;
  --card: #fffdf6;
  --ink: #1b1b20;
  --ink-soft: #66666f;
  --blood: #c0261e;
  --xp: #3b6fb6;
  --gold: #c99a17;
  --hand: "Patrick Hand", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--hand); font-size: 18px;
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
}
#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.ui { position: fixed; z-index: 2; }
#hud {
  top: calc(8px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px));
  width: min(40vw, 150px); display: grid; gap: 3px;
  background: rgba(255,253,246,.8); border: 1.5px solid var(--ink); border-radius: 8px; padding: 4px 6px;
}
.who { display: flex; gap: 6px; align-items: center; font-size: 15px; line-height: 1; }
.who .bar { flex: 1; }
.bar { position: relative; height: 12px; border: 1.5px solid var(--ink); border-radius: 3px; background: rgba(0,0,0,.06); overflow: hidden; }
.bar > b { position: absolute; inset: 0; font: 10px/10px system-ui, sans-serif; font-weight: 600; text-align: center; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.bar.mana { height: 10px; margin-top: 3px; } .bar.mana > i { background: #3b6fb6; }
.cpick { display: grid; grid-template-columns: repeat(3, minmax(0, 230px)); justify-content: center; column-gap: 8px; }
.ccard { grid-row: span 6; display: grid; grid-template-rows: subgrid; row-gap: 4px; justify-items: center; align-items: start; min-width: 0; padding: 8px 6px 10px; border: 2px solid var(--ink); border-radius: 12px; background: var(--card); text-align: center; font-family: inherit; color: var(--ink); cursor: pointer; }
@media (hover: hover) { .ccard:hover { border-color: var(--cc); box-shadow: 0 0 0 3px var(--cc); } }
.ccard:focus-visible { border-color: var(--cc); box-shadow: 0 0 0 3px var(--cc); }
.ccard canvas { width: 100%; max-width: 150px; height: auto; }
.ccard b { font-size: 22px; line-height: 1.1; color: var(--cc); } .ccard small { font-size: 14px; color: var(--ink-soft); } .ccard em { font-style: normal; font-size: 13px; border: 1px solid var(--ink-soft); border-radius: 8px; padding: 0 6px; }
.ccard span { font-size: 14px; line-height: 1.25; }
.ccard .perk { align-self: stretch; display: flex; align-items: center; justify-content: center; font-weight: normal; font-size: 14px; line-height: 1.25; padding: 4px 6px; border-radius: 8px; background: color-mix(in srgb, var(--cc) 16%, transparent); color: var(--cc); }
.bar > i { display: block; height: 100%; width: 50%; background: var(--blood); transition: width .15s; }
.bar.xp { height: 5px; border-width: 1px; }
.bar.xp > i { background: var(--xp); }
.coins { color: var(--gold); }
.zone { display: flex; justify-content: space-between; font-size: 13px; line-height: 1; color: var(--ink-soft); }
#menu { top: var(--hudb, calc(66px + env(safe-area-inset-top, 0px))); left: max(10px, env(safe-area-inset-left, 0px)); display: flex; gap: 6px; }
/* Lee: the menu sits on the same line as the health box, music button last. Phones too narrow for that keep it underneath */
@media (min-width: 700px) {
  #menu { top: calc(8px + env(safe-area-inset-top, 0px)); left: calc(max(10px, env(safe-area-inset-left, 0px)) + min(40vw, 150px) + 22px); }
  body #toasts { top: calc(72px + env(safe-area-inset-top, 0px)); }
}
/* Narrow phones: the row wraps instead of sliding under the minimap */
@media (max-width: 699px) {
  /* Lee: every menu button on one line on the phone */

  #menu button { font-size: 13px; padding: 2px 5px; border-radius: 7px; flex: 0 1 auto; min-width: 0; white-space: nowrap; }
  #menu:has(#btnRide:not([hidden])) { gap: 2px; }
  #menu:has(#btnRide:not([hidden])) button { font-size: 12px; padding: 2px 4px; }
  body #toasts { top: calc(136px + env(safe-area-inset-top, 0px)); }
}
#menu button { font-size: 15px; padding: 2px 9px; border-width: 1.5px; border-radius: 8px; }
button {
  font-family: var(--hand); font-size: 18px; color: var(--ink); background: var(--card);
  border: 2px solid var(--ink); border-radius: 10px; padding: 4px 12px; cursor: pointer; touch-action: manipulation;
}
button:focus-visible { outline: 3px solid var(--xp); outline-offset: 2px; }
button:disabled { opacity: .45; }
#mapbox { top: calc(8px + env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); display: grid; gap: 6px; justify-items: end; }
#stoneDial { position: absolute; right: 126px; top: 0; width: 40px; height: 40px; cursor: pointer; }

#zoneTag { width: 120px; box-sizing: border-box; margin-top: -3px; text-align: center; font-size: 15px; line-height: 1.15; background: rgba(255,253,246,.92); border: 1.5px solid var(--ink); border-radius: 6px; padding: 2px 4px; }

#tracker { width: max-content; max-width: min(46vw, 200px); font-size: 16px; line-height: 1.2; text-align: right; background: rgba(255,253,246,.85); border-radius: 8px; padding: 4px 8px; display: grid; gap: 4px; }
#tracker:empty { display: none; }

body.desk #tracker { width: max-content; max-width: 250px; font-size: 17px; }
/* Phone (Lee): just your oldest quest, in a box you can fold away */
#tracker.fold { cursor: pointer; pointer-events: auto; font-size: 14px; width: max-content; max-width: min(46vw, 190px); padding: 3px 7px; }
#tracker.fold b::before { content: "\25BE  "; color: var(--ink-soft); }

#tracker.fold.shut span, #tracker.fold.shut i, #tracker.fold.shut .more { display: none; }
#tracker.fold i { font-size: 12px; }

#pad {
  right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  width: 190px; height: 190px;
}
#pad button { position: absolute; border-radius: 50%; padding: 0; display: grid; place-items: center; line-height: 1; }
#btnAttack { right: 0; bottom: 0; width: 92px; height: 92px; font-size: 22px; background: var(--ink); color: var(--card); }
/* inner ring around Attack: Dodge left, Whirl on the diagonal, Potion above. The skill arc sits outside it */
#btnDodge { right: 105px; bottom: 19px; width: 54px; height: 54px; font-size: 15px; }
#btnSkill { right: 80px; bottom: 80px; width: 54px; height: 54px; font-size: 15px; }
#btnPotion { right: 19px; bottom: 105px; width: 54px; height: 54px; font-size: 15px; }
#btnMana { right: 23px; bottom: 166px; width: 46px; height: 46px; font-size: 13px; } #btnMana[hidden] { display: none; }
/* Lee: phone controls take less room. Locked skills stay hidden, and small phones shrink the whole cluster */
#pad, #pad2 { transform-origin: 100% 100%; scale: var(--padk, 1); }
#btnSkill[hidden] { display: none; }
#btnMore { display: none; }
@media (max-width: 699px) {
  #btnSound { display: none; } #btnMore { display: inline-block; }
  #minimap { width: 104px; height: 128px; } #zoneTag { width: 104px; font-size: 14px; }
  #menu { max-width: calc(100vw - 132px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); }
}
#abar { left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; align-items: center; gap: 8px; padding: 8px 0 0; }
#abar[hidden] { display: none; }
/* Phone skills fan out in an arc around Attack (Lee picked it), with a More button for items */
#pad2 { right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); width: 0; height: 0; }
#pad2 button { position: absolute; width: 50px; height: 50px; padding: 0; font-size: 13px; }
#pad2 .nb .ic { top: 5px; width: 24px; height: 24px; margin-left: -12px; }
#pad2 .nb .l { font-size: 12px; bottom: 3px; }
#pad2 .nb.more { border-radius: 50%; width: 46px; height: 46px; }
#pad2 .nb.more .ic { top: 3px; }
body.desk #pad2 { display: none; }
/* Lee: class skills line up down the right side, under the quest box, one by one as they unlock. Hold one to swap places */
#skillcol { right: max(10px, env(safe-area-inset-right, 0px)); top: var(--skt, 300px); display: flex; flex-direction: column; gap: 9px; align-items: flex-end; transform-origin: 100% 0; scale: var(--skk, 1); }
#skillcol button { position: relative; width: 52px; height: 52px; padding: 0; font-size: 13px; }
#skillcol .nb .ic { top: 5px; width: 24px; height: 24px; margin-left: -12px; }
#skillcol .nb .l { font-size: 12px; bottom: 3px; }
#skillcol .nb:nth-child(odd) { rotate: -1.4deg; }
body.desk #skillcol, body.cine #skillcol, body.mapopen #skillcol, body.charopen #skillcol { display: none; }
body.skedit #skillcol .nb { animation: skwig .3s ease-in-out infinite alternate; }

@keyframes skwig { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
.skdemo { display: flex; gap: 14px; justify-content: center; align-items: center; margin: 8px 0; font-size: 15px; color: var(--ink-soft); }
.skdemo span { display: inline-grid; place-items: center; width: 46px; height: 46px; border: 1.6px solid var(--ink); border-radius: 6px; background: #fffef8; color: #2c3e7a; font-size: 13px; }
.skdemo span.pick { outline: 3px solid var(--gold); outline-offset: 2px; }
#abar { z-index: 6; }
.sheet .item[draggable="true"] { cursor: grab; }
#abar button { position: relative; width: 58px; height: 58px; padding: 0; font-size: 14px; line-height: 1.05; }
#abar button.empty { border-style: dashed; border-color: rgba(27,27,32,.3); background: rgba(255,254,248,.55); }
#abar button.empty::before { display: none; }
#abar button.over { outline: 3px solid var(--gold); }
#abar button.dragging { opacity: .4; }
#abar .k { position: absolute; top: 1px; left: 5px; font-size: 13px; color: #c0392b; }
#abar .pencil { width: 18px; height: 62px; margin-left: 6px; transform: rotate(22deg); pointer-events: none; }
/* Notebook page look: doodle cards taped to ruled paper, blue ink, an eraser smudge for cooldowns */
.nb { position: relative; color: #2c3e7a; background: #fffef8 repeating-linear-gradient(to bottom, transparent 0 11px, rgba(90,140,200,.33) 11px 12px);
  border: 1.6px solid rgba(38,38,46,.85); border-radius: 4px 7px 5px 8px / 7px 4px 8px 5px; box-shadow: 1px 2px 0 rgba(38,38,46,.14); overflow: visible; }
.nb::before { content: ""; position: absolute; top: -6px; left: 50%; width: 24px; height: 10px; margin-left: -12px; background: rgba(240,220,140,.8); transform: rotate(-6deg); pointer-events: none; z-index: 1; }
.nb .ic { position: absolute; left: 50%; top: 7px; width: 28px; height: 28px; margin-left: -14px; pointer-events: none; }
.nb .ic svg { width: 100%; height: 100%; display: block; fill: none; stroke: currentColor; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; filter: url(#pencilfx); overflow: visible; }
.nb .ic .fill { fill: rgba(192,57,43,.55); stroke: none; } .nb .ic .fill.mana { fill: rgba(59,111,182,.6); }
.nb .l { position: absolute; left: 0; right: 0; bottom: 3px; text-align: center; font-size: 14px; line-height: 1; white-space: nowrap; pointer-events: none; }
.nb .n { position: absolute; top: 2px; right: 5px; color: #c0392b; font-size: 13px; letter-spacing: 1px; line-height: 1; pointer-events: none; }
.nb .n s { text-decoration-thickness: 1.5px; }
.nb.nlock { color: rgba(38,38,46,.45); }
.nb .cd { inset: auto 2px 2px 2px; height: calc(var(--p, 0%) * .96); border-radius: 2px; background:
  radial-gradient(ellipse 3px 2px at 18% 78%, rgba(220,140,150,.9) 98%, transparent), radial-gradient(ellipse 3px 2px at 72% 55%, rgba(220,140,150,.9) 98%, transparent),
  radial-gradient(ellipse 2px 3px at 46% 88%, rgba(220,140,150,.9) 98%, transparent), radial-gradient(ellipse 3px 2px at 84% 82%, rgba(220,140,150,.9) 98%, transparent),
  linear-gradient(to top, rgba(150,150,160,.6), rgba(150,150,160,.28)); }
#abar .nb:nth-child(3n+1), #pad2 .nb:nth-child(odd) { rotate: -1.4deg; }

#pad .nb { border-radius: 5px 8px 6px 9px / 8px 5px 9px 6px; }

#btnAttack.nb { background: #fffef8 repeating-linear-gradient(to bottom, transparent 0 11px, rgba(90,140,200,.33) 11px 12px); }
#btnAttack.nb::before { top: -4px; transform: rotate(8deg); }
#btnAttack.nb .ic { width: 36px; height: 36px; margin-left: -18px; top: 14px; }
#btnAttack.nb .l { bottom: 15px; font-size: 18px; }
#btnDodge.nb { transform: rotate(-1.5deg); } #btnSkill.nb { transform: rotate(1.2deg); } #btnPotion.nb { transform: rotate(-.6deg); }
#pad2 button.nb { overflow: visible; }
#pad2 .nb .lab { position: absolute; right: calc(100% + 7px); top: 50%; transform: translateY(-50%); font-size: 15px; color: #2c3e7a; white-space: nowrap; pointer-events: none;
  text-shadow: 0 0 3px #fffef8, 0 0 3px #fffef8, 0 0 4px #fffef8; }
body.desk #btnDodge, body.desk #btnSkill, body.desk #btnPotion, body.desk #btnMana { display: none; }
.cd { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(rgba(0,0,0,.35) var(--p, 0%), transparent 0); pointer-events: none; }
#banner {
  top: 28%; left: 0; right: 0; text-align: center; pointer-events: none; opacity: 0; transition: opacity .4s;
  text-shadow: 0 0 6px var(--paper), 0 0 3px var(--paper);
}
#banner.show { opacity: 1; }
#banner .big { font-size: 40px; text-wrap: balance; }

#toasts { top: calc(102px + env(safe-area-inset-top, 0px)); left: max(10px, env(safe-area-inset-left, 0px)); right: 0; display: grid; justify-items: start; gap: 4px; pointer-events: none; }
.toast { background: var(--card); border: 1.5px solid var(--ink); border-radius: 8px; padding: 1px 10px; font-size: 15px; max-width: min(52vw, 260px); animation: up 2.6s forwards; }
.toast.item { animation: upLong 5s forwards; }

#panel[hidden] { display: none; }

  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}

.sheet.mapfull { width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; border: 0; border-radius: 0; padding: 0; display: flex; align-items: center; justify-content: center; box-sizing: border-box; overflow: hidden; background: #1b1b20; }
.mapwrap { position: relative; height: min(100vh, calc(100vw * 4 / 3)); height: min(100dvh, calc(100vw * 4 / 3)); aspect-ratio: 3 / 4; }

@media (max-width: 620px) {
  #panel:has(.charsheet) { padding: 0; }

  const k = o.boss ? [8, 1.4, 12, 12] : o.elite ? [5, 1.3, 6, 6] : [1, 1, 1, 1], c = foeCoin(lv) * k[3];
  FOES[id] = { name, lv, art, speed: 120, r: 18, ...o,
    hp: Math.round((20 * lv + 45) * k[0] * (o.hpK || 1)), atk: Math.round(foeAtk(lv) * k[1] * (o.atkK || 1)), xp: Math.round((8 * lv + 0.4 * lv * lv) * k[2]),
    coins: [Math.round(c * 0.8), Math.round(c * 1.2)],
    drops: o.boss ? [["greater_potion", 2]] : o.elite ? [["greater_potion", 1]] : [["potion", .08], ["greater_potion", .03]],
    tierDrop: o.boss ? 1 : o.elite ? 0.5 : 0.006 };
}

const CELL = 200;
function makeMap(m) {
  m.rects = m.rects || []; m.circles = m.circles || []; m.ellipses = m.ellipses || []; m.objs = m.objs || [];
  m.doors = m.doors || []; m.spawners = m.spawners || []; m.decor = m.decor || []; m.walk = m.walk || []; m.foes = []; m.shots = []; m.marks = []; m.pshots = []; m.whirls = m.whirls || [];
  m.grid = new Map();
  const add = (cx, cy, o) => { const k = cx + "," + cy; if (!m.grid.has(k)) m.grid.set(k, []); m.grid.get(k).push(o); };
  for (const c of m.circles) add(Math.floor(c.x / CELL), Math.floor(c.y / CELL), c);
  for (const q of m.rects) for (let cx = Math.floor(q.x / CELL); cx <= Math.floor((q.x + q.w) / CELL); cx++) for (let cy = Math.floor(q.y / CELL); cy <= Math.floor((q.y + q.h) / CELL); cy++) add(cx, cy, q);
  m.dgrid = new Map();
  for (const d of m.decor) { const k = Math.floor(d.x / CELL) + "," + Math.floor(d.y / CELL); if (!m.dgrid.has(k)) m.dgrid.set(k, []); m.dgrid.get(k).push(d); }
  return m;
}
function near(m, x0, y0, x1, y1, grid) {
  const out = new Set();
  for (let cx = Math.floor(x0 / CELL) - 1; cx <= Math.floor(x1 / CELL) + 1; cx++)
    for (let cy = Math.floor(y0 / CELL) - 1; cy <= Math.floor(y1 / CELL) + 1; cy++) { const a = (grid || m.grid).get(cx + "," + cy); if (a) for (const o of a) out.add(o); }
  return out;
}
function blocked(m, x, y, r, shot) {
  if (x < r || y < r || x > m.w - r || y > m.h - r) return true;
  // Dungeons: you can only stand on the floor
  if (m.floors) { const k = m.fall ? 3 : r; if (!(onFloor(m, x - k, y - k) && onFloor(m, x + k, y - k) && onFloor(m, x - k, y + k) && onFloor(m, x + k, y + k))) return true; }
  const cv = m.collapse; if (cv && cv.front != null && x > cv.x - 80 && x < cv.x + cv.w + 80 && y < cv.front + 30 && y > cv.y0 - 420) return true;
  for (const o of near(m, x - 1, y - 1, x + 1, y + 1)) {
    // shots fly over ore veins (Lee): they only block walking
    if (shot && o.kind === "nodeblock") continue;
    if (o.r !== undefined) { if (o.kind === "gate" && o.open > 0.5) continue; if (Math.hypot(o.x - x, o.y - y) < o.r + r) return true; }
    else if (!o.ghost && x + r > o.x && x - r < o.x + o.w && y + r > o.y && y - r < o.y + o.h) return true;
  }
  // The temple bridge crosses the lake
  if (m.walk.some(w => (w.on ? w.on() : temple.risen) && x > w.x + r && x < w.x + w.w - r && y > w.y && y < w.y + w.h)) return false;
  for (const e of m.ellipses) { const dx = (x - e.x) / (e.rx + r), dy = (y - e.y) / (e.ry + r); if (dx * dx + dy * dy < 1) return true; }
  return false;
}

// =====================================================================
// The temple rises: shake, pan to the lake, temple and bridge come up, pan back
// =====================================================================
const LAKE_VIEW = [LAKE[0], LAKE[1] + 40];
function startRise() {
  temple.pending = false; cine = { t: 0, splash: 0, rumble: 0 }; joy.active = false;
  document.body.classList.add("cine"); document.getElementById("gearPrompt").hidden = true;
  banner("The ground trembles...", ""); sfx("rumble");
}
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
function cineCam() {
  const V = cine.view || LAKE_VIEW;
  const t = cine.t, k = t < 1.4 ? 0 : t < 3.4 ? ease((t - 1.4) / 2) : t < 8.8 ? 1 : 1 - ease((t - 8.8) / 1.6);
  return [player.x + (V[0] - player.x) * k, player.y + (V[1] - player.y) * k];
}
// The Hollow opens: the trees of western Thornwood groan and bend apart
function startHollow() {
  hollow.pending = false; cine = { t: 0, kind: "hollow", view: [HOLLOW[0], HOLLOW[1] - 40], leaf: 0, rumble: 0 }; joy.active = false;
  document.body.classList.add("cine"); document.getElementById("gearPrompt").hidden = true;
  banner("The trees are groaning...", ""); sfx("rumble");
}
function hollowCine(dt) {
  const c = cine; c.t += dt; const t = c.t;
  if (t < 1.4) shake = Math.max(shake, 6);
  else if (t < 3.4) shake = Math.max(shake, 2.5);
  else if (t < 7.4) {
    hollow.rise = ease((t - 3.4) / 3.4); shake = Math.max(shake, 1 + 3 * (1 - hollow.rise));
    if ((c.leaf -= dt) <= 0) { c.leaf = 0.07; const a = Math.random() * 6.28; fx.push({ kind: "shard", x: HOLLOW[0] + Math.cos(a) * 160, y: HOLLOW[1] - 180 + Math.sin(a) * 60, vx: Math.cos(a) * 120, vy: -40, a: Math.random() * 6, life: 0.9, max: 0.9 }); }
    if ((c.rumble -= dt) <= 0) { c.rumble = 0.9; sfx("rumble"); }
  }
  if (t >= 7.4 && !c.announced) { c.announced = true; setHollow(); sfx("rare"); banner("The Hollow has opened!", `A dark forest dungeon for level ${HOLLOW_LEVEL} and up, in western Thornwood`); }
  if (t >= 10.4) { cine = null; document.body.classList.remove("cine"); renderTracker(); }
}
function cineUpdate(dt) {
  if (cine.kind === "hollow") return hollowCine(dt);
  if (cine.kind === "dg") return dgCine(dt);
  const c = cine; c.t += dt; const t = c.t;
  if (t < 1.4) shake = Math.max(shake, 7);
  else if (t < 3.4) shake = Math.max(shake, 3);
  else if (t < 7.4) {
    temple.rise = ease((t - 3.4) / 3); temple.bridge = Math.max(0, Math.min(1, (t - 5.2) / 2.1));
    shake = Math.max(shake, 1.5 + 4 * (1 - temple.rise));
    if ((c.splash -= dt) <= 0) { c.splash = 0.12; const a = Math.random() * 6.28; fx.push({ kind: "ring", x: LAKE[0] + Math.cos(a) * (130 + Math.random() * 60), y: LAKE[1] + 35 + Math.sin(a) * 40, r: 24 + Math.random() * 24, life: 0.6, max: 0.6, color: "#6fa8c8" }); }
    if ((c.rumble -= dt) <= 0) { c.rumble = 0.9; sfx("rumble"); sfx("splash"); }
  }
  if (t >= 7.4 && !c.announced) { c.announced = true; setRisen(); sfx("rare"); banner("The Drowned Temple has risen!", `A dungeon for level ${TEMPLE_LEVEL} and up, across the new bridge`); }
  if (t >= 10.4) { cine = null; document.body.classList.remove("cine"); renderTracker(); }
}

// =====================================================================
// Update
// =====================================================================
function update(dt) {
  clock += dt; shake = Math.max(0, shake - dt * 14);
  if (bannerTimer > 0 && (bannerTimer -= dt) <= 0) document.getElementById("banner").classList.remove("show");
  if (gpTimer > 0 && (gpTimer -= dt) <= 0) document.getElementById("gearPrompt").hidden = true;
  musicTick(dt); ambienceTick(dt); folkTick(dt); keeperTick(dt); penTick(dt); gatherTick(dt); lessonTick(dt);
  // Save your spot every few seconds, so a page reload puts you back where you were
  if ((autoSaveT -= dt) <= 0) { autoSaveT = 5; if (window.__started && !player.dead && !transition && !cine && !player.ride && (!map.fall || onFloor(map, player.x, player.y))) save(); }
  for (const e of fx) { e.life -= dt; if (e.kind === "shard") { e.x += e.vx * dt; e.y += e.vy * dt; e.vy += 400 * dt; e.a += dt * 8; } if (e.kind === "text") e.y -= 40 * dt; }
  for (let i = fx.length - 1; i >= 0; i--) if (fx[i].life <= 0) fx.splice(i, 1);
  if (transition) {
    transition.t += dt;
    if (transition.t > 0.22 && !transition.done) { transition.done = true; transition.go(); }
    if (transition.t > 0.3) { transition = null; document.getElementById("fade").classList.remove("on"); }
    return;
  }
  if (cine) { cineUpdate(dt); return; }
  if (paused) return;
  if (map.id === "world" && !player.dead && bannerTimer < 1.4 && panel.hidden) { if (temple.pending) { startRise(); return; } if (hollow.pending) { startHollow(); return; } const pg = DGL.find(g => g.pending); if (pg) { startReveal(pg); return; } }

  const p = player, s = stats();
  for (const k of ["attackT", "attackCd", "dodgeCd", "skillCd", "skillT", "potionCd", "hurtT"]) p[k] = Math.max(0, p[k] - dt);
  skillsUpdate(dt); classTick(dt); achUpdate(dt); petUpdate(dt); wolfUpdate(dt);

  if (p.dead) { p.dead -= dt; if (p.dead <= 0) respawn(); }
  else {
    const [jx, jy] = joyDir();
    if (p.ride) rideUpdate(p, dt);
    else if (map.vehicle) vehicleMove(p, jx, jy, dt);
    else if (p.dashT > 0) dashMove(p, dt);
    else if (p.dodgeT > 0) { p.dodgeT = Math.max(0, p.dodgeT - dt); move(p, p.dodgeDir[0] * 420 * dt, p.dodgeDir[1] * 420 * dt, 12); }
    else if (jx || jy) {
      const sp = (p.attackT > 0 && cls() === "warrior" ? 130 : 250) * (riding() ? 1 + STEEDS[bestSteed()].spd / 100 : 1) * (buffOn("feather") ? 1.2 : 1) * (cls() === "hunter" ? 1.1 : 1);
      move(p, jx * sp * dt, jy * sp * dt, 12);
      if (Math.abs(jx) > 0.15) p.facing = Math.sign(jx);
      p.walk += dt * 10 * Math.hypot(jx, jy); p.moving = true; p.lastDir = [jx, jy]; p.lastMoveT = clock;
    } else p.moving = false;
    if (clock - p.lastHurt > 8) p.hp = Math.min(s.maxHp, p.hp + s.maxHp * 0.02 * dt);
    // Doors
    for (const d of map.doors) if (!(d.needsRisen && !temple.risen) && !(d.needs && !DG[d.needs].risen) && !(d.needsKeep && !keepOpen()) && p.x > d.x - 6 && p.x < d.x + d.w + 6 && p.y > d.y - 6 && p.y < d.y + d.h + 14) { const T = MAPS[d.to]; goTo(d.to, d.tx ?? T.IN[0], d.ty ?? T.IN[1]); return; }
  }

  const z = map.zoneAt(p.x, p.y);
  if (z.id !== zoneId) {
    if (map.dungeon && z.check && !p.dead) map.check = z.check;
    if (map.dungeon && z.heal && !p.dead) { p.hp = Math.min(stats().maxHp, p.hp + Math.round(stats().maxHp * 0.3)); setTimeout(() => toast("The fire warms you up. Health restored a little"), 1500); }
    zoneId = z.id; banner(z.name, z.armor ? `${z.lv}. Recommended armor ${z.armor}` : z.lv); document.getElementById("zoneName").textContent = z.name;
    if (z.armor && s.def < z.armor) setTimeout(() => toast(`Your armor (${s.def}) is low for ${z.name}. Enemies here will hit hard.`), 1200);
  }
  if (map.id === "world") {
    const gate = map.gate || (map.gate = map.rects.find(q => q.kind === "northgate"));
    gate.ghost = northOpen();
    if (Math.abs(p.x - 12000) < 220 && clock - gateNoticeAt > 8) {
      if (!gate.ghost && Math.abs(p.y - NECK) < 170) { gateNoticeAt = clock; banner("The North Gate", "It opens when the Bandit King falls, or at level 12"); }
      else if (Math.abs(p.y - ROWS[2]) < 170) { gateNoticeAt = clock; banner("Inkstone Keep", keepOpen() ? "The seven stones blaze in the gate. The Eraser King waits. Level 50 raid" : `Sealed. ${stoneCount()} of ${STONES.length} stones are set in the gate. Each dungeon holds one`); }
    }
    for (const o of map.objs) {
      if (o.kind === "waystone" && !found.includes(o.id) && Math.hypot(o.x - p.x, o.y - p.y) < 140) { found.push(o.id); toast(`Waystone found: ${o.name}`); save(); }
      if (o.kind === "pickup" && quests[o.quest]?.state === "active" && !taken.includes(o.id) && Math.hypot(p.x - o.x, p.y - o.y) < 36) { taken.push(o.id); questEvent("collect", o.thing); }
      if (o.kind === "bush") {
        if (o.regrow > 0) o.regrow -= dt;
        else if (quests[o.quest]?.state === "active" && Math.hypot(p.x - o.x, p.y - o.y) < 50) { o.regrow = 45; questEvent("collect", o.thing); }
      }
    }
  }

  for (const f of [...map.foes]) if (Math.abs(f.x - p.x) < 1800 && Math.abs(f.y - p.y) < 1800) foeUpdate(f, dt);
  pshotsUpdate(dt); if (map.whirls.length) whirlUpdate(dt); if (map.dungeon) dgHazards(dt);
  for (const mk of map.marks) {
    mk.t += dt;
    if (!mk.hit && mk.t >= mk.wind) {
      mk.hit = true; shake = Math.max(shake, 4);
      if (!p.dead && ((p.x - mk.x) / mk.r) ** 2 + ((p.y - mk.y) / (mk.r * 0.6)) ** 2 < 1) hurtPlayer(mk.atk, mk.lv);
    }
  }
  map.marks = map.marks.filter(mk => mk.t < mk.wind + 0.45);
  for (const sh of map.shots) {
    sh.x += sh.vx * dt; sh.y += sh.vy * dt; sh.life -= dt;
    if (sh.grace > 0) sh.grace -= dt;
    else if (!map.openShots && blocked(map, sh.x, sh.y + 30, 2, true) && !(sh.kind === "rock" && sh.life > 0.3)) sh.life = 0;
    if (!p.dead && Math.abs(sh.x - p.x) < (map.vehicle ? 26 : 14) && sh.y > p.y - 70 && sh.y < p.y - 5) {
      if (p.dodgeT > 0) continue;
      hurtPlayer(sh.atk, sh.lv); sh.life = 0;
      if (sh.kind === "fireball") fx.push({ kind: "ring", x: sh.x, y: p.y, r: 30, life: 0.3, max: 0.3, color: "#e07a2a" });
    }
  }
  map.shots = map.shots.filter(sh => sh.life > 0);
  for (const sp of map.spawners) if (sp.patrol && Math.abs(sp.x - p.x) < 2200 && Math.abs(sp.y - p.y) < 2200) {
    const [tx, ty] = sp.patrol.pts[sp.patrol.i], dx = tx - sp.x, dy = ty - sp.y, dd = Math.hypot(dx, dy);
    if (dd < 10) { const P = sp.patrol; if (P.i + P.dir >= P.pts.length || P.i + P.dir < 0) P.dir *= -1; P.i += P.dir; }
    else { sp.x += dx / dd * 45 * dt; sp.y += dy / dd * 45 * dt; }
  }
  for (const sp of map.spawners) {
    const back = sp.back || (sp.back = []);
    for (let i = 0; i < back.length; i++) back[i] -= dt;
    if (sp.quest && !sp.live && !back.length && quests[sp.quest]) spawnFoe(map, sp, true);
    if (sp.questOnly && quests[sp.questOnly]?.state !== "active") { if (!map.foes.some(f => f.spawner === sp && (f.aggro || Math.hypot(f.x - p.x, f.y - p.y) < 700))) { map.foes = map.foes.filter(f => f.spawner !== sp); map.spawners.splice(map.spawners.indexOf(sp), 1); } continue; }
    if (back.length && back[0] <= 0 && sp.live < sp.n && Math.hypot(p.x - sp.x, p.y - sp.y) > 500) { back.shift(); spawnFoe(map, sp, true); }
    // A rare elite that hasn't shown up yet still rolls its chance every 4 minutes
    if (sp.live + back.length < sp.n) { sp.timer += dt; if (sp.timer > (sp.respawn || 60)) { sp.timer = 0; if (Math.hypot(p.x - sp.x, p.y - sp.y) > 500) spawnFoe(map, sp); } }
  }
}

function drawMini() {
